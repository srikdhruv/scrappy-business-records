[project]
name = "scrappy-records"
version = "0.1.0"
description = "A small, local-only fee tracker for class-based businesses."
license = "MIT"
requires-python = ">=3.12,<3.13"
# Every dependency must be pure Python or ship prebuilt Windows wheels: the bundle is assembled
# in CI and nothing is ever compiled on the user's laptop. That is why uvicorn is installed
# without the `[standard]` extra (uvloop has no Windows support).
dependencies = [
    "alembic>=1.13",
    "certifi>=2024.2.2",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.100",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom (`= Depends(...)`, `= Query(...)`) trips B008.
"app/routers/*.py" = ["B008"]
