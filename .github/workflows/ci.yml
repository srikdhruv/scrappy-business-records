name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (e.g. v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and dependencies
        run: uv sync --frozen
      - name: Lint (backend and scripts/)
        run: uv run ruff check . ../scripts
      - name: Format check
        run: uv run ruff format --check . ../scripts
      - name: Tests
        run: uv run pytest

  backend-windows:
    # The user's laptop runs Windows: paths, SQLite file handling and startup must work there.
    name: Backend on Windows (pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and dependencies
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the build landed in the backend package
        run: test -f ../backend/app/static/index.html

  e2e:
    name: End-to-end (Playwright, real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (e.g. v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Build, start the server, run the tests
        run: make e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  api-contract:
    name: API contract (schema.d.ts up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (e.g. v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)
      - name: Regenerate frontend/src/api/schema.d.ts
        run: make gen-api
      - name: Fail if it changed
        run: |
          if ! git diff --exit-code -- frontend/src/api/schema.d.ts; then
            echo "::error file=frontend/src/api/schema.d.ts::The API changed but schema.d.ts wasn't regenerated. Run 'make gen-api' and commit the result."
            exit 1
          fi

  windows-install:
    # The real thing, on the user's OS: build the bundle, then install and run it with Windows
    # PowerShell 5.1 and no Python or uv on PATH. See scripts/ci/smoke_install_windows.ps1.
    name: Windows install (bundle, installer, launcher, data survives restart and update)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # setup-uv publishes no floating major tag (e.g. v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache the downloaded Python
        uses: actions/cache@v6
        with:
          path: ~/.cache/scrappy-bundle
          key: scrappy-bundle-${{ runner.os }}-${{ hashFiles('scripts/build_bundle.py') }}
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build the bundle (the script self-tests it)
        run: uv run --project backend python scripts/build_bundle.py
      - name: Install and run it like a user (Windows PowerShell 5.1, no Python or uv on PATH)
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts\ci\smoke_install_windows.ps1
          -ZipPath dist\scrappy-records-windows-x64.zip

  macos-install:
    # The same for the Mac bundle and scripts/install.sh (see scripts/ci/smoke_install_mac.sh).
    name: macOS install (bundle, installer, launcher, data survives restart and update)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # setup-uv publishes no floating major tag (e.g. v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache the downloaded Python
        uses: actions/cache@v6
        with:
          path: ~/.cache/scrappy-bundle
          key: scrappy-bundle-${{ runner.os }}-${{ hashFiles('scripts/build_bundle.py') }}
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build the bundle (the script self-tests it)
        run: uv run --project backend python scripts/build_bundle.py
      - name: Install and run it like a user (env -i, no developer tools on PATH)
        run: scripts/ci/smoke_install_mac.sh dist/scrappy-records-macos-arm64.zip
